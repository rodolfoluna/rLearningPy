name: Publicar la app web

# Compila la app web (PWA: alumnos y profesor en una sola app) con la configuración de Firebase
# de los secretos VITE_FIREBASE_* y la publica en GitHub Pages.
#  - En cada push a main (y a mano desde la pestaña Actions): compila y publica.
#  - En las etiquetas v*: además agrega el sitio en .zip al Release.
#
# Requisitos (ver docs/INSTALACION.md):
#  - Secretos del repositorio: VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN,
#    VITE_FIREBASE_PROJECT_ID y VITE_FIREBASE_APP_ID.
#  - Settings → Pages → Build and deployment → Source: GitHub Actions.
#  - Opcional: variable del repositorio RLP_BASE con la ruta del sitio. Por defecto
#    /<nombre-del-repositorio>/ (https://<usuario>.github.io/<repositorio>/), o / si el
#    repositorio se llama <usuario>.github.io o si usas un dominio propio.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  web:
    name: Compilar el sitio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Revisar la configuración de Firebase
        run: |
          if [ -z "$VITE_FIREBASE_API_KEY" ] || [ -z "$VITE_FIREBASE_PROJECT_ID" ]; then
            echo "::error::Faltan los secretos VITE_FIREBASE_* (Settings → Secrets and variables → Actions). Ver docs/INSTALACION.md."
            exit 1
          fi
      - name: Ruta base del sitio
        env:
          BASE_VARIABLE: ${{ vars.RLP_BASE }}
          REPO: ${{ github.event.repository.name }}
          DUENO: ${{ github.repository_owner }}
        run: |
          base="$BASE_VARIABLE"
          if [ -z "$base" ]; then
            if [ "$(echo "$REPO" | tr 'A-Z' 'a-z')" = "$(echo "$DUENO" | tr 'A-Z' 'a-z').github.io" ]; then base="/"; else base="/$REPO/"; fi
          fi
          echo "RLP_BASE=$base" >> "$GITHUB_ENV"
          echo "Ruta base: $base"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm preparar
      - run: pnpm --filter @rlp/alumno-web build
      - name: Empaquetar el sitio
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || version="$(node -p 'require("./apps/alumno-web/package.json").version')-${GITHUB_SHA::7}"
          mkdir -p dist-web
          (cd apps/alumno-web/dist && zip -qr "$GITHUB_WORKSPACE/dist-web/RLP-web-$version.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: rlp-web
          path: dist-web/*.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/alumno-web/dist
      - name: Agregar el sitio al Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-web/*.zip
          prerelease: ${{ contains(github.ref_name, '-') }}

  pages:
    name: Publicar en GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
